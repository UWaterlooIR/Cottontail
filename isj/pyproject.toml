[project]
name = "isj-agent"
version = "0.1.0"
description = "Agentic ISJ investigation planner over Cottontail (TREC RAG 2026)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.40",
]

[project.scripts]
cottontail-index = "isj_agent.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isj_agent"]
artifacts = ["isj_agent/**/*.md"]

[dependency-groups]
dev = ["pytest>=8.0"]
