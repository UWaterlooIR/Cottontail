# isj configuration file — example
#
# Copy this file to isj/config.toml and edit as needed.
# config.toml is git-ignored; this example file is the checked-in reference.
#
# Usage (from repo root):
#   cp isj/config.example.toml isj/config.toml

# ---------------------------------------------------------------------------
# [llm.<name>]
# Named LLM profiles. Each profile defines a vLLM endpoint and the model
# served on it. Profiles are referenced by name in [agents.<role>].
# ---------------------------------------------------------------------------
[llm.default]

# Base URL of the vLLM endpoint (OpenAI-compatible API).
# Local deployments typically use the loopback address.
base_url = "http://127.0.0.1:8000/v1"

# Must match the --served-model-name option used when launching the vLLM instance.
model = "gpt.oss.120b"

# Name of the environment variable holding the API key for this endpoint.
# If not set here, the key defaults to "EMPTY", which works for unauthenticated
# local vLLM instances. If set, the named environment variable must exist at
# startup or an error is raised.
# api_key_env = "MY_VLLM_API_KEY"

# ---------------------------------------------------------------------------
# [agents.<role>]
# Maps each agent role to an implementation class and a named LLM profile.
# class: fully-qualified Python class path — the CLI uses load_class() to
#        resolve and instantiate it. To swap implementations, point this at
#        a different class with the same interface.
# llm:   name of the [llm.*] profile to use for this agent.
# ---------------------------------------------------------------------------
[agents.analyst]
class = "isj_agent.agents.analyst.Analyst"
llm = "default"
# reasoning_effort = "medium"   # default; forwarded via extra_body

[agents.searcher]
class = "isj_agent.agents.searcher.Searcher"
llm = "default"
# Optional PROMPT OVERRIDE (directable prompt): point the searcher at a prompt file
# instead of the class's bundled <role>.md. A relative path resolves against the repo
# root; a missing file fails loudly at startup. Omit to use the bundled default.
#   prompt = "isj/scouting/lucindri-query/lucindri_prompt_v4.txt"
# To author TIERED precise->broad GCL cascades instead of single covers, swap in:
#   class = "isj_agent.agents.tiered_searcher.TieredSearcher"
# Or to author the tiers as a MultiText DSL PROGRAM (macros + @rank; compiled
# server-side, compile errors bounce back for self-correction -- TASK-22):
#   class = "isj_agent.agents.mt_tiered_searcher.MultiTextTieredSearcher"
# It exposes the tiered_query_search tool (needs the cottontail server built after
# TASK-19); everything else here (llm, reasoning_effort, fetch_k, window, max_queries)
# applies unchanged. KEEP reasoning_effort = "medium" for the tiered searcher: at
# "high", gpt-oss-120b falls into pathological reasoning loops (repetition /
# compulsive quote-verification) that time out or bloat reasoning ~14-28x with no
# quality gain -- see isj/scouting/multitext-dsl/captured/FINDINGS.md.
# Defaults shown (reasoning_effort defaults to "medium" for every agent):
# reasoning_effort = "medium"  # default; forwarded via extra_body
# fetch_k = 200               # the LARGE per-request ranking batch the controller pulls
# window = 75                 # cover_search summary window (tokens)
# max_queries = 100           # per-intent backstop on the number of queries

[agents.judger]
class = "isj_agent.agents.judger.Judger"
llm = "default"
# Pointwise full-document judging (0-3 + reason). Defaults from the serving scout
# (decode-bound on the dev GPU; concurrency 15 is the throughput peak):
# concurrency = 15            # in-flight judge calls AND the controller's wave width
# reasoning_effort = "medium" # default; raising to "high" is a throughput/cost lever
#                             # (the scout_judger.py serving scout ran high) -- forwarded via extra_body

# ---------------------------------------------------------------------------
# [loop]
# Controller knobs for the per-intent search/judge loop (defaults shown).
# ---------------------------------------------------------------------------
[loop]
# nonrelevant_streak = 5        # stop descending after this many non-relevant docs in a row
# relevant_grade_threshold = 1  # non-relevant-for-the-streak = grade < this (default: grade 0)
# max_judgments = 1000          # RUN-TOTAL judgment budget, split evenly across intents
# max_doc_chars = 50000         # truncate each judged document to this many chars
# max_list_depth =              # optional per-query descent safety cap (unset = off)

# ---------------------------------------------------------------------------
# [index]
# Settings for the cp-native index front door (cottontail-index / the
# isj_agent.index CLI), which builds a burrow from JSONL and its cp<->docno map.
# ---------------------------------------------------------------------------
[index]

# Path to the C++ cottontail-jsonl-index binary the front door subprocesses.
# A relative path is resolved against the repository root; an absolute path is
# used as-is. Override per-invocation with --index-bin. The default points at the
# Bazel build output.
binary = "bazel-bin/apps/cottontail-jsonl-index"

# ---------------------------------------------------------------------------
# [query]
# Settings for the docno fetch helper (cottontail-fetch), which resolves
# docno -> cp (Python, isj_agent.docno_map) and reads the text via the C++ query
# binary by cp.
# ---------------------------------------------------------------------------
[query]

# Path to the C++ cottontail-jsonl-query binary (relative paths resolve against
# the repository root). Override per-invocation with --query-bin.
binary = "bazel-bin/apps/cottontail-jsonl-query"

# ---------------------------------------------------------------------------
# [cottontail_http_json_server]
# The running cottontail-jsonl-server the Searcher queries over HTTP
# (cover_search / get_document). Start it (from the repo root) over a
# --stem porter burrow, e.g.:
#   bazel-bin/apps/cottontail-jsonl-server --burrow my.burrow --port 8080
# A loopback (127.0.0.1) server runs without auth by default; off-loopback
# needs a bearer token (set api_key_env to the env var holding it).
# ---------------------------------------------------------------------------
[cottontail_http_json_server]
base_url = "http://127.0.0.1:8080"
# Query timeout in seconds (default 3600 = 1 hour). Deliberately LONG: an HTTP
# client timeout is not a cancel — the server keeps computing the abandoned
# request — so short timeouts waste server work and bounce misleading errors to
# the model. Connection establishment fails fast (10s) regardless.
# timeout_s = 3600
# The burrow the server is serving. Its <burrow>/docno-cp.sqlite is the cp<->docno
# map the CLI opens read-only to rewrite cp->docno when writing run output. Omit (or
# point at a docno-less burrow) to persist raw cps; --burrow overrides per run.
# burrow = "my-stemmed.burrow"
# api_key_env = "COTTONTAIL_API_TOKEN"   # bearer-token env var; omit on a no-token loopback server
