# isj configuration file — example
#
# Copy this file to isj/config.toml and edit as needed.
# config.toml is git-ignored; this example file is the checked-in reference.
#
# Usage (from repo root):
#   cp isj/config.example.toml isj/config.toml

# ---------------------------------------------------------------------------
# [llm.<name>]
# Named LLM profiles. Each profile defines a vLLM endpoint and the model
# served on it. Profiles are referenced by name in [agents.<role>].
# ---------------------------------------------------------------------------
[llm.default]

# Base URL of the vLLM endpoint (OpenAI-compatible API).
# Local deployments typically use the loopback address.
base_url = "http://127.0.0.1:8000/v1"

# Must match the --served-model-name option used when launching the vLLM instance.
model = "gpt.oss.120b"

# Name of the environment variable holding the API key for this endpoint.
# If not set here, the key defaults to "EMPTY", which works for unauthenticated
# local vLLM instances. If set, the named environment variable must exist at
# startup or an error is raised.
# api_key_env = "MY_VLLM_API_KEY"

# Model context window in tokens. Used by the SEARCHER's profile to bound the Searcher's
# cumulative conversation via context compaction (TASK-40; see [loop].compact_trigger). If
# omitted, the CLI best-effort auto-discovers it from vLLM's /v1/models (max_model_len);
# if that also fails, compaction is simply disabled (safe). Never hardcoded.
# context_limit = 131072

# ---------------------------------------------------------------------------
# [agents.<role>]
# Maps each agent role to an implementation class and a named LLM profile.
# class: fully-qualified Python class path — the CLI uses load_class() to
#        resolve and instantiate it. To swap implementations, point this at
#        a different class with the same interface.
# llm:   name of the [llm.*] profile to use for this agent.
# ---------------------------------------------------------------------------
# Every agent BOUNDS its LLM generation (TASK-37) so a gpt-oss reasoning-loop runaway
# cannot spew tokens unbounded and hang the run (a judge wave blocks on a barrier, so one
# looping call freezes everything). Both are ON by default; override per agent:
#   max_tokens   cap on generated tokens (reasoning + output). A judge that hits it fails
#                its parse -> retry -> grade -2; a searcher that hits it -> no_query bounce.
#   timeout_s    per-call wall-clock timeout (a stuck connection can't hang the wave).
# Defaults: analyst/judger max_tokens=8000 timeout_s=120; searcher max_tokens=16000 timeout_s=180.

[agents.analyst]
# class choices (build_analyst resolves whichever is set):
#   isj_agent.agents.analyst.Analyst              (default) -> disambiguated interpretations
#   isj_agent.agents.report_analyst.ReportAnalyst (TASK-42) -> RAG-report components (prompt-report-v3)
# Both emit the same Intents{question, interpretations[]} contract, so downstream is unchanged.
class = "isj_agent.agents.analyst.Analyst"
llm = "default"
# reasoning_effort = "medium"   # default; forwarded via extra_body
# temperature = 0.0             # GREEDY default (TASK-38): holds the question->interpretations
#                               # decomposition stable across runs so cross-run comparisons are
#                               # fair. Raise it only to deliberately diversify decompositions.
# max_tokens = 8000             # generation cap (default)
# timeout_s = 120               # per-call timeout in seconds (default)
#
# REUSABLE ANALYSIS (TASK-41). This same [agents.analyst] block also drives
# `python -m isj_agent.analyze --topics <tsv> --out <dir>`, which runs the analyst once per
# topic and writes a reusable artifact (<dir>/<topic_id>.json). Feed one to a run with
# `isj run --analysis-file <topic_id>.json` (instead of --question) and the Analyst is skipped
# entirely — so ONE analysis drives many searcher configs and analyst variation is factored out
# of cross-searcher comparisons. To use a different analyst (e.g. a report-component decomposer),
# just point `class` at it here; the artifact shape is analyst-agnostic.

[agents.searcher]
class = "isj_agent.agents.searcher.Searcher"
llm = "default"
# Optional PROMPT OVERRIDE (directable prompt): point the searcher at a prompt file
# instead of the class's bundled <role>.md. A relative path resolves against the repo
# root; a missing file fails loudly at startup. Omit to use the bundled default.
#   prompt = "isj/scouting/lucindri-query/lucindri_prompt_v4.txt"
# To author TIERED precise->broad GCL cascades instead of single covers, swap in:
#   class = "isj_agent.agents.tiered_searcher.TieredSearcher"
# Or to author the tiers as a MultiText DSL PROGRAM (macros + @rank; compiled
# server-side, compile errors bounce back for self-correction -- TASK-22):
#   class = "isj_agent.agents.mt_tiered_searcher.MultiTextTieredSearcher"
# It exposes the tiered_query_search tool (needs the cottontail server built after
# TASK-19); everything else here (llm, reasoning_effort, fetch_k, window, max_queries)
# applies unchanged. KEEP reasoning_effort = "medium" for the tiered searcher: at
# "high", gpt-oss-120b falls into pathological reasoning loops (repetition /
# compulsive quote-verification) that time out or bloat reasoning ~14-28x with no
# quality gain -- see isj/scouting/multitext-dsl/captured/FINDINGS.md.
# Defaults shown (reasoning_effort defaults to "medium" for every agent):
# reasoning_effort = "medium"  # default; forwarded via extra_body
# fetch_k = 200               # the LARGE per-request ranking batch the controller pulls
# window = 75                 # cover_search summary window (tokens)
# max_queries = 100           # per-intent backstop on the number of queries
# max_tokens = 16000          # generation cap (default; larger than analyst/judger for programs)
# timeout_s = 180             # per-call timeout in seconds (default)

[agents.judger]
class = "isj_agent.agents.judger.Judger"
llm = "default"
# Pointwise full-document judging (0-3 + reason). Defaults from the serving scout
# (decode-bound on the dev GPU; concurrency 15 is the throughput peak):
# concurrency = 15            # in-flight judge calls AND the controller's wave width
# reasoning_effort = "medium" # default; raising to "high" is a throughput/cost lever
#                             # (the scout_judger.py serving scout ran high) -- forwarded via extra_body
# max_tokens = 8000           # generation cap (default; a runaway judge -> parse fail -> retry -> grade -2)
# timeout_s = 120             # per-call timeout in seconds (default)

# ---------------------------------------------------------------------------
# [loop]
# Controller knobs for the per-intent search/judge loop (defaults shown).
# ---------------------------------------------------------------------------
[loop]
# nonrelevant_streak = 5        # stop descending after this many non-relevant docs in a row
# relevant_grade_threshold = 1  # non-relevant-for-the-streak = grade < this (default: grade 0)
# max_judgments = 1000          # RUN-TOTAL judgment budget, split evenly across intents
# max_doc_chars = 50000         # truncate each judged document to this many chars
# max_list_depth =              # optional per-query descent safety cap (unset = off)
#
# Context compaction (TASK-40) -- a rarely-triggering SAFETY NET that bounds the Searcher's
# cumulative context by shrinking OLD coaching feedback in place (drops each old report's
# "## Cited passages" section, keeping the coaching prose + vocabulary line; hard-truncates
# if that section is absent). Needs the searcher [llm.*] profile's context_limit (above);
# without it, compaction is disabled. Triggers on the server-reported prompt_tokens, so it
# only fires on genuinely long runs; not something you normally tune.
# compact_trigger = 0.80        # shrink a pass once prompt_tokens reaches this fraction of context_limit
# shrink_truncate_tokens = 800  # hard-truncate size (~tokens) when a report has no "## Cited passages"

# ---------------------------------------------------------------------------
# [coach] — the SearchCoach that turns a query's judged results into the Searcher's
# feedback after judging (TASK-40). Two implementations:
#   MechanicalSearchCoach — deterministic listing of the top-N + high-grade-nugget passages
#                           (the default, and the always-works fallback).
#   SearchCoachAgent       — an LLM that writes a free-text coaching report (what's working /
#                           hurting / pursue next + a self-contained "Cited passages" section
#                           reproducing the excerpts verbatim). Query-blind and atom-blind.
# See docs/design/search-coach.md.
# ---------------------------------------------------------------------------
# [coach]
# class = "isj_agent.agents.search_coach.MechanicalSearchCoach"   # default
#
# --- LLM coach: swap the class and (optionally) name a distinct [llm.*] profile ----------
# The coach BOUNDS its generation (TASK-37) and is bracketed by an 'await_coach' live marker
# and a purpose="coach" trace event. If it raises (timeout / connection / parse), the
# Controller silently falls back to the mechanical coach below, so a coach failure never
# stalls the search. It writes FREE TEXT (no guided decoding — that degraded on gpt-oss-120b).
# class = "isj_agent.agents.search_coach.SearchCoachAgent"
# llm = "default"                # [llm.*] profile for the coach (defaults to "default")
# reasoning_effort = "medium"    # default; forwarded via extra_body
# temperature = 0.0              # GREEDY default; deterministic coaching
# max_tokens = 8000              # generation cap (default)
# timeout_s = 120                # per-call timeout in seconds (default)
# input_top_k = 25               # coach INPUT: top band by rank (any grade) it is shown
# input_min_grade = 3            # plus any deeper doc graded >= this (the gold nuggets)
# prompt = "isj/scouting/search-coach/prompt-v6.md"   # optional override of the bundled prompt

# The mechanical coach's selection (also the always-works fallback whenever an LLM coach is
# configured). Per query it forwards the TOP `top_results_to_show` of the ranking regardless
# of grade (so the Searcher always sees what its query does at the top, including docs judged
# on prior queries) PLUS any deeper doc graded >= `min_show_grade` (the gold nuggets). Shown
# docs keep their TRUE ranks. These moved here from [loop] (still read from [loop] as a
# DEPRECATED fallback).
# [coach.mechanical]
# top_results_to_show = 10
# min_show_grade = 3

# ---------------------------------------------------------------------------
# [index]
# Settings for the cp-native index front door (cottontail-index / the
# isj_agent.index CLI), which builds a burrow from JSONL and its cp<->docno map.
# ---------------------------------------------------------------------------
[index]

# Path to the C++ cottontail-jsonl-index binary the front door subprocesses.
# A relative path is resolved against the repository root; an absolute path is
# used as-is. Override per-invocation with --index-bin. The default points at the
# Bazel build output.
binary = "bazel-bin/apps/cottontail-jsonl-index"

# ---------------------------------------------------------------------------
# [query]
# Settings for the docno fetch helper (cottontail-fetch), which resolves
# docno -> cp (Python, isj_agent.docno_map) and reads the text via the C++ query
# binary by cp.
# ---------------------------------------------------------------------------
[query]

# Path to the C++ cottontail-jsonl-query binary (relative paths resolve against
# the repository root). Override per-invocation with --query-bin.
binary = "bazel-bin/apps/cottontail-jsonl-query"

# ---------------------------------------------------------------------------
# [engine]
# Config-SELECTED SearchEngine (docno on the wire). Names the engine class + its
# base_url; the CLI constructs exactly this ONE engine at startup. The controller is
# engine-agnostic (it talks only to the SearchEngine interface), so swapping engines
# is a config change, not a code change. A mismatched engine<->searcher pairing is the
# operator's responsibility.
#
# Cottontail (default): the C++ cottontail-jsonl-server (cover_search / get_document).
# Start it (from the repo root) over a --stem porter burrow, e.g.:
#   bazel-bin/apps/cottontail-jsonl-server --burrow my.burrow --port 8080
# It owns the cp<->docno map, so give it the served burrow (for <burrow>/docno-cp.sqlite);
# the engine translates cp<->docno at its boundary, so the agent sees only docnos.
# ---------------------------------------------------------------------------
[engine]
class = "isj_agent.engine.http.HttpSearchEngine"
base_url = "http://127.0.0.1:8080"
burrow = "Scrapheap/climbmix-1M-porter.burrow"  # served burrow; --burrow overrides per run
# Query timeout in seconds (default 3600 = 1 hour). Deliberately LONG: an HTTP client
# timeout is not a cancel — the server keeps computing the abandoned request — so short
# timeouts waste server work and bounce misleading errors to the model. Connect fails
# fast (10s) regardless.
# timeout_s = 3600
# api_key_env = "COTTONTAIL_API_TOKEN"   # bearer-token env var; omit on a no-token loopback server
#
# --- Lucindri engine (TASK-33): a Dirichlet-LM search over a LucindriServer ------
# Docno-native: URL only, NO burrow. The server is operator-launched (start the
# LucindriServer jar with --index <lucindri index> --port 9000); the CLI polls /healthz
# on startup and FAILS FAST if it is down. Pair it with the LucindriSearcher class +
# prompt in [agents.searcher] (e.g. prompt = the vDefault / v4 scouting prompt).
#   class = "isj_agent.engine.lucindri.LucindriSearchEngine"
#   base_url = "http://127.0.0.1:9000"
#   # timeout_s = 3600
#
# --- Sharded Cottontail (TASK-34): fan out across N single-burrow servers ---------
# The corpus is PARTITIONED into N sub-burrows (build-test-shards.sh), each served by its
# own cottontail-jsonl-server (launch-test-shard-servers.sh, ports 7000+). The engine runs
# the query on all N in parallel and merges by score into the true global top_k -- exact
# because the cover-density ranker is stats-free. Each shard entry is a single-Cottontail
# config (base_url + burrow, so each shard emits real docnos). Any shard error fails the
# whole search (no silent partial results); every shard's /healthz is checked on startup.
#   class = "isj_agent.engine.multishard.MultiShardSearchEngine"
#   shards = [
#     { base_url = "http://127.0.0.1:7000", burrow = "/share/indexes/climbmix_test_shards/part00.burrow" },
#     { base_url = "http://127.0.0.1:7001", burrow = "/share/indexes/climbmix_test_shards/part01.burrow" },
#     { base_url = "http://127.0.0.1:7002", burrow = "/share/indexes/climbmix_test_shards/part02.burrow" },
#     { base_url = "http://127.0.0.1:7003", burrow = "/share/indexes/climbmix_test_shards/part03.burrow" },
#   ]
